server.port=${SERVER_PORT:8081}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:drone-db-service}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.listener.ack-mode=record
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/drone}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:drone}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:drone}
spring.sql.init.mode=always
drone.kafka.topic=${DRONE_KAFKA_TOPIC:drone-positions}
